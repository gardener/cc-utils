name: Release
on:
  workflow_dispatch:
    inputs:
      release-to-pypi:
        required: false
        type: boolean
        default: false
        description: Whether to release to PYPI
      slack-channel-id:
        type: string
        default: C0170EXLULE # gardener-cicd channel
        description: which slack-channel to post release-notes to (defaults to gardener-cicd)
      post-to-slack:
        type: boolean
        default: true
        description: post to slack

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build-and-test.yaml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      mode: release

  pin:
    uses: ./.github/workflows/pin-actions-and-workflows.yaml
    needs:
      - build
    secrets: inherit
    permissions:
      contents: write
      id-token: write
    with:
      own-ref: refs/capture-commit
      release-commit-objects-artefact: release-commit-objects

  # TEMPORARY DEBUG (revert before merge): surface the pin-tip value the caller actually receives,
  # to localize why release-tag-commitish arrived empty despite pin.py emitting pin-tip.
  debug-pin-tip:
    needs:
      - pin
    runs-on: ubuntu-latest
    steps:
      - name: echo pin-tip seen by caller
        run: |
          echo "::notice title=pin-tip::caller sees needs.pin.outputs.pin-tip = [${{ needs.pin.outputs.pin-tip }}]"
          echo "pin-tip = [${{ needs.pin.outputs.pin-tip }}]"

  release-to-github-and-bump:
    uses: ./.github/workflows/release.yaml
    needs:
      - build
      - pin
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      release-commit-target: branch
      next-version: bump-minor
      slack-channel-id: ${{ inputs.post-to-slack && 'C0170EXLULE' || '' }}
      # tag the transitively-frozen pin tip (not the release-commit) so the immutable release tag is
      # truly immutable transitively. Empty on a no-op pin run -> release falls back to tagging the
      # release-commit (today's behaviour).
      release-tag-commitish: ${{ needs.pin.outputs.pin-tip }}

  pypi:
    if: ${{ inputs.release-to-pypi }}
    runs-on: ubuntu-latest
    name: Publish to PYPI
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve Distribution Packages
        uses: gardener/cc-utils/.github/actions/download-artifact@808fef9ce3a75749d9a79530d6616f03fb6fed09
        with:
          name: distribution-packages
          path: /tmp/dist
      - name: prepare build-filesystem
        id: prepare
        run: |
          ls -lta /tmp/dist
          mv /tmp/dist/distribution-packages.tar.gz .
          tar xf distribution-packages.tar.gz
          ls -lta dist/
          rm -rf dist/blobs.d dist/ocm_resources.yaml
          ls -lta dist/
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
