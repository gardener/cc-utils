name: Pin Actions and Workflows
description: |
  Generates a snapshot of this repository's GitHub Actions and reusable workflows
  on a separate target branch (default: `v1`), where all cross-references between
  actions and workflows are pinned by commit digest rather than by branch name.

  Consumers may reference the target branch for a rolling latest-pinned pointer,
  or any specific commit digest it ever pointed to for full immutability.

  See README.md in this action's directory for full rationale and usage guidance.

inputs:
  own-ref:
    type: string
    default: master
    description: |
      Ref (branch name or commit digest) to read from. Pinned commits are derived
      from the commit this ref resolves to.
  target-branch:
    type: string
    default: v1
    description: |
      Branch to push pinned commits to. Will be force-pushed. Consumers may
      reference this branch (for a rolling latest-pinned pointer) or any specific
      commit digest it ever pointed to (for full immutability).
  own-org:
    type: string
    default: ''
    description: |
      GitHub organisation owning this repository (e.g. `gardener`). Used to
      identify own `uses:` references that need to be rewritten. Defaults to the
      organisation derived from `github.repository`.
  own-repo:
    type: string
    default: ''
    description: |
      GitHub repository name (e.g. `cc-utils`). Used together with `own-org` to
      identify own `uses:` references that need to be rewritten. Defaults to the
      repository name derived from `github.repository`.
  bundle-dir:
    type: string
    default: ''
    description: |
      Path to a pre-built bundle directory (as produced by bundle-gardener-gha-libs).
      If set, the bundle-gardener-gha-libs step is skipped and this directory is used directly.
  git-user-name:
    type: string
    default: github-actions[bot]
    description: |
      Git author name used for pinning commits.
  git-user-email:
    type: string
    default: github-actions[bot]@users.noreply.github.com
    description: |
      Git author email used for pinning commits.
  release-commit-objects-artefact:
    type: string
    default: ''
    description: |
      Optional name of an artifact produced by `capture-commit` (e.g. `release-commit-objects`).
      If set, the artifact is imported before pinning so that the commit it contains is
      reachable and can be passed as `own-ref`.
  allowed-base:
    type: string
    default: ''
    description: |
      Branch `own-ref` must be reachable from, or be a release commit on top of (see
      README.md). Fetched from `origin` before pinning. Defaults to the repository's
      default branch. Pass `-` to disable the check (not recommended).
  push-ssh-key:
    type: string
    default: ''
    description: |
      Optional SSH private key (typically a deploy key with write access, stored as
      environment secret) to push target branch and preservation ref with. If set, the
      push is done via SSH using this key, instead of the credentials configured by
      checkout. Intended to be combined with a ruleset on the target branch that only
      allows this deploy key to bypass (see README.md).

runs:
  using: composite
  steps:
    - name: install-dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install --quiet gitpython ruamel.yaml

    - name: configure-git-identity
      shell: bash
      run: |
        set -euo pipefail
        git config --global user.name '${{ inputs.git-user-name }}'
        git config --global user.email '${{ inputs.git-user-email }}'

    - name: import-release-commit
      if: ${{ inputs.release-commit-objects-artefact != '' }}
      uses: gardener/cc-utils/.github/actions/import-commit@master
      with:
        commit-objects-artefact: ${{ inputs.release-commit-objects-artefact }}
        after-import: noop

    - uses: gardener/cc-utils/.github/actions/bundle-gardener-gha-libs@master
      id: bundle
      if: ${{ inputs.bundle-dir == '' }}

    - name: pin
      shell: bash
      run: |
        set -euo pipefail

        bundle_dir='${{ inputs.bundle-dir }}'
        [ -z "${bundle_dir}" ] && bundle_dir='${{ steps.bundle.outputs.bundle-dir }}'

        # derive org/repo from github.repository if not explicitly provided
        own_org='${{ inputs.own-org }}'
        own_repo='${{ inputs.own-repo }}'
        if [ -z "${own_org}" ]; then
          own_org='${{ github.repository_owner }}'
        fi
        if [ -z "${own_repo}" ]; then
          own_repo='${{ github.event.repository.name }}'
        fi

        allowed_base='${{ inputs.allowed-base }}'
        if [ -z "${allowed_base}" ]; then
          allowed_base='${{ github.event.repository.default_branch }}'
        fi
        if [ -z "${allowed_base}" ]; then
          echo '::error::could not determine default branch - pass `allowed-base` explicitly'
          exit 1
        fi
        allowed_base_args=()
        if [ "${allowed_base}" != '-' ]; then
          # always check against remote state (local branch might have been tampered with)
          git fetch --no-tags origin \
            "+refs/heads/${allowed_base}:refs/remotes/origin/${allowed_base}"
          allowed_base_args=(--allowed-base "refs/remotes/origin/${allowed_base}")
        fi

        '${{ github.action_path }}/pin.py' \
          --repo-root '${{ github.workspace }}' \
          --own-ref '${{ inputs.own-ref }}' \
          --target-branch '${{ inputs.target-branch }}' \
          --own-org "${own_org}" \
          --own-repo "${own_repo}" \
          --bundle-dir "${bundle_dir}" \
          "${allowed_base_args[@]}"

    - name: push
      shell: bash
      env:
        PUSH_SSH_KEY: ${{ inputs.push-ssh-key }}
      run: |
        set -euo pipefail

        remote=origin
        if [ -n "${PUSH_SSH_KEY}" ]; then
          key_dir=$(mktemp -d)
          trap 'rm -rf "${key_dir}"' EXIT
          printf '%s\n' "${PUSH_SSH_KEY}" > "${key_dir}/key"
          chmod 600 "${key_dir}/key"
          host='${{ github.server_url }}'
          host="${host#https://}"

          # retrieve host keys via (TLS-authenticated) API; GHES does not expose them
          curl -sSfL -H 'Authorization: Bearer ${{ github.token }}' '${{ github.api_url }}/meta' \
            | jq -r --arg host "${host}" '.ssh_keys // [] | .[] | "\($host) \(.)"' \
            > "${key_dir}/known_hosts"
          if [ -s "${key_dir}/known_hosts" ]; then
            host_key_opts="-o UserKnownHostsFile=${key_dir}/known_hosts -o StrictHostKeyChecking=yes"
          else
            echo "::warning::no ssh host keys published for ${host} - accepting on first use"
            host_key_opts='-o StrictHostKeyChecking=accept-new'
          fi

          # do not use credentials configured by checkout (those must not be able to push)
          export GIT_SSH_COMMAND="ssh -i ${key_dir}/key -o IdentitiesOnly=yes ${host_key_opts}"
          remote="git@${host}:${{ github.repository }}.git"
        fi

        git push --force "${remote}" 'refs/heads/${{ inputs.target-branch }}'
        git push "${remote}" "refs/tags/fixated/$(git rev-parse '${{ inputs.own-ref }}')"
