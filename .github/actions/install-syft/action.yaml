name: Install Syft
description: |
  Installs syft (SBOM scanner) with graceful fallback.

  Version resolution order:
    1. Try to determine greatest version from github.com/releases redirect.
    2. Fall back to `pinned-version` input if lookup fails.

  Installation order:
    1. If a pre-installed syft >= target version is found on PATH, use it as-is.
    2. On cache miss, download via the anchore install script.

  Error semantics:
    OK      - pre-installed or fresh download succeeded at target version.
    warning - version lookup failed (using pinned fallback), or upgrade download failed
              but a pre-installed version is available.
    error   - no usable syft binary after all attempts.

inputs:
  pinned-version:
    required: false
    default: '1.51.0'
    description: |
      Fallback version used when the GitHub version lookup fails.
      Update this periodically to pull in newer syft releases.

outputs:
  version:
    description: The syft version available after this action completes.
    value: ${{ steps.result.outputs.version }}

runs:
  using: composite
  steps:
    - name: determine-version
      id: version
      shell: bash
      run: |
        set -eu

        install_dir="${HOME}/.local/bin"
        mkdir -p "${install_dir}"
        echo "install-dir=${install_dir}" >> "${GITHUB_OUTPUT}"

        # --- version lookup (non-fatal, 3 retries) ---
        greatest_version=""
        for attempt in 1 2 3; do
          greatest_version=$(
            curl -sSo /dev/null --max-time 10 \
              -w '%{redirect_url}' \
              'https://github.com/anchore/syft/releases/latest' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' \
            2>/dev/null
          ) && [ -n "${greatest_version}" ] && break
          greatest_version=""
          [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
        done

        if [ -n "${greatest_version}" ]; then
          target="${greatest_version}"
          echo "lookup-failed=false" >> "${GITHUB_OUTPUT}"
        else
          target="${{ inputs.pinned-version }}"
          echo "lookup-failed=true" >> "${GITHUB_OUTPUT}"
          echo "::warning::syft: version lookup failed; using pinned version ${target}"
        fi
        echo "target=${target}" >> "${GITHUB_OUTPUT}"
        echo "target syft version: ${target}"

        # --- check pre-installed ---
        installed_version=""
        if which syft >/dev/null 2>&1; then
          installed_version=$(
            syft version --output json 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
            2>/dev/null
          ) || true
        fi
        echo "pre-installed=${installed_version}" >> "${GITHUB_OUTPUT}"

        # --- decide ---
        if [ -z "${installed_version}" ]; then
          echo "needs-install=true" >> "${GITHUB_OUTPUT}"
        else
          is_current=$(python3 -c "v1=tuple(int(x) for x in '${installed_version}'.split('.'));v2=tuple(int(x) for x in '${target}'.split('.'));print('yes' if v1>=v2 else 'no')")
          if [ "${is_current}" = "yes" ]; then
            echo "syft ${installed_version} >= ${target} (target) — skipping install"
            echo "needs-install=false" >> "${GITHUB_OUTPUT}"
          else
            echo "syft ${installed_version} < ${target} (target) — will attempt upgrade"
            echo "needs-install=true" >> "${GITHUB_OUTPUT}"
          fi
        fi

    - name: download
      id: download
      if: ${{ steps.version.outputs.needs-install == 'true' }}
      shell: bash
      run: |
        set -eu
        install_ok=false
        attempts=3
        # retry the download: we observed rare transient network/TLS flakes on
        # solinas runners; fresh connection usually fixes it
        for attempt in $(seq 1 ${attempts}); do
          if curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b '${{ steps.version.outputs.install-dir }}' \
                 'v${{ steps.version.outputs.target }}'; then
            install_ok=true
            break
          fi
          echo "::warning::syft: download failed (attempt ${attempt}/${attempts})"
          if [ ${attempt} -lt ${attempts} ]; then
            sleep $((attempt * 5))
          fi
        done
        echo "success=${install_ok}" >> "${GITHUB_OUTPUT}"

    - name: add-to-path
      if: ${{ steps.version.outputs.needs-install == 'true' }}
      shell: bash
      run: echo '${{ steps.version.outputs.install-dir }}' >> "${GITHUB_PATH}"

    - name: result
      id: result
      if: always()
      shell: bash
      run: |
        set -eu
        pre_installed='${{ steps.version.outputs.pre-installed }}'
        needs_install='${{ steps.version.outputs.needs-install }}'
        download_ok='${{ steps.download.outputs.success }}'

        if [ "${needs_install}" = "false" ]; then
          # used pre-installed, already >= target
          version=$(syft version --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [ "${download_ok}" = "true" ]; then
          version=$(syft version --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # install failed — warn if pre-installed fallback exists, error otherwise
        if [ -n "${pre_installed}" ]; then
          echo "::warning::syft: failed to install/upgrade to ${{ steps.version.outputs.target }}; using pre-installed version ${pre_installed}"
          echo "version=${pre_installed}" >> "${GITHUB_OUTPUT}"
        else
          echo "::error::syft: failed to install and no pre-installed version is available"
          exit 1
        fi
