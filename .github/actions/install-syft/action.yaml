name: Install Syft
description: |
  Installs syft (SBOM scanner) with graceful fallback.

  Version resolution:
    Looks up the latest version from github.com/releases. If the lookup fails,
    skips the download and falls back to a pre-installed syft.

  Installation order:
    1. Look up the latest version from github.com/releases.
    2. If a pre-installed syft == latest is found on PATH, use it as-is.
    3. Otherwise download the latest version via the anchore install script.
    4. If lookup or download fails, fall back to any pre-installed syft.

  Error semantics:
    OK      - pre-installed or fresh download succeeded.
    warning - version lookup or download failed but a pre-installed version is available.
    error   - no usable syft binary after all attempts.

outputs:
  version:
    description: The syft version available after this action completes.
    value: ${{ steps.result.outputs.version }}

runs:
  using: composite
  steps:
    - name: determine-version
      id: version
      shell: bash
      run: |
        set -eu

        install_dir="${HOME}/.local/bin"
        mkdir -p "${install_dir}"
        echo "install-dir=${install_dir}" >> "${GITHUB_OUTPUT}"

        # --- check pre-installed ---
        installed_version=""
        if which syft >/dev/null 2>&1; then
          installed_version=$(syft version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1) || true
        fi
        echo "pre-installed=${installed_version}" >> "${GITHUB_OUTPUT}"

        # --- version lookup (non-fatal, 3 retries) ---
        latest_version=""
        for attempt in 1 2 3; do
          latest_version=$(
            curl -sSo /dev/null --max-time 10 \
              -w '%{redirect_url}' \
              'https://github.com/anchore/syft/releases/latest' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' \
            2>/dev/null
          ) && [ -n "${latest_version}" ] && break
          latest_version=""
          [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
        done

        if [ -z "${latest_version}" ]; then
          echo "::warning::syft: version lookup failed; skipping download"
          echo "needs-install=false" >> "${GITHUB_OUTPUT}"
          echo "target=" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        echo "target=${latest_version}" >> "${GITHUB_OUTPUT}"
        echo "target syft version: ${latest_version}"

        # --- decide ---
        if [ -n "${installed_version}" ]; then
          if [ "${installed_version}" = "${latest_version}" ]; then
            echo "syft ${installed_version} == ${latest_version} (latest) — skipping install"
            echo "needs-install=false" >> "${GITHUB_OUTPUT}"
          else
            echo "syft ${installed_version} != ${latest_version} (latest) — will attempt upgrade"
            echo "needs-install=true" >> "${GITHUB_OUTPUT}"
          fi
        else
          echo "needs-install=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: download
      id: download
      if: ${{ steps.version.outputs.needs-install == 'true' }}
      shell: bash
      run: |
        set -eu
        install_ok=false
        attempts=3
        # retry the download: we observed rare transient network/TLS flakes on
        # solinas runners; fresh connection usually fixes it
        for attempt in $(seq 1 ${attempts}); do
          if curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b '${{ steps.version.outputs.install-dir }}' \
                 'v${{ steps.version.outputs.target }}'; then
            install_ok=true
            break
          fi
          echo "::warning::syft: download failed (attempt ${attempt}/${attempts})"
          if [ ${attempt} -lt ${attempts} ]; then
            sleep $((attempt * 5))
          fi
        done
        echo "success=${install_ok}" >> "${GITHUB_OUTPUT}"

    - name: add-to-path
      if: ${{ steps.version.outputs.needs-install == 'true' }}
      shell: bash
      run: echo '${{ steps.version.outputs.install-dir }}' >> "${GITHUB_PATH}"

    - name: result
      id: result
      if: always()
      shell: bash
      run: |
        set -eu
        pre_installed='${{ steps.version.outputs.pre-installed }}'
        needs_install='${{ steps.version.outputs.needs-install }}'
        download_ok='${{ steps.download.outputs.success }}'

        if [ "${needs_install}" = "false" ]; then
          # pre-installed == latest, or lookup failed (using pre-installed as-is)
          if syft version >/dev/null 2>&1; then
            version=$(syft version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::error::syft: version lookup failed and no pre-installed version is available"
          exit 1
        fi

        if [ "${download_ok}" = "true" ]; then
          version=$(syft version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # install failed — warn if pre-installed fallback exists, error otherwise
        if [ -n "${pre_installed}" ]; then
          echo "::warning::syft: failed to install/upgrade to ${{ steps.version.outputs.target }}; using pre-installed version ${pre_installed}"
          echo "version=${pre_installed}" >> "${GITHUB_OUTPUT}"
        else
          echo "::error::syft: failed to install and no pre-installed version is available"
          exit 1
        fi
