name: component-descriptor-to-constructor
description: |
  Transforms a component-descriptor into an OCM component constructor YAML (single-component
  format) suitable for `ocm add cv`.

  Reads the descriptor from a tarball artifact (as produced by `base-component-descriptor`).
  The tarball may contain either `component-descriptor.yaml` (meta/component wrapper format)
  or `base-component.yaml` (intermediate BaseComponent format) — both are handled.

inputs:
  component-descriptor-artefact:
    required: false
    default: base-component-descriptor
    description: |
      Name of the GHA artifact containing the component-descriptor tarball
      (as produced by the `base-component-descriptor` action).
  output-path:
    required: false
    default: component-constructor.yaml
    description: |
      Path on the runner filesystem to write the constructor YAML to.

outputs:
  component-constructor-artifact:
    description: |
      Name of the GHA artifact containing the constructor YAML.
    value: component-constructor
  component-constructor-path:
    description: |
      Path to the component-constructor.yaml on the runner filesystem.
    value: ${{ inputs.output-path }}

runs:
  using: composite
  steps:
    - uses: gardener/cc-utils/.github/actions/install-gardener-gha-libs@v1
    - uses: gardener/cc-utils/.github/actions/download-artifact@v1
      with:
        name: ${{ inputs.component-descriptor-artefact }}
    - name: extract-and-transform
      id: transform
      shell: python
      run: |
        import os
        import sys
        import tarfile

        import yaml

        sys.path.insert(0, os.environ['GITHUB_ACTION_PATH'])
        import transform

        archive = 'component-descriptor.tar.gz'
        with tarfile.open(archive) as tf:
            tf.extract('base-component.yaml', path='.')

        with open('base-component.yaml') as f:
            component_descriptor = yaml.safe_load(f)

        constructor = transform.to_constructor(component_descriptor)

        output_path = '${{ inputs.output-path }}'
        with open(output_path, 'w') as f:
            yaml.safe_dump(constructor, f, default_flow_style=False, allow_unicode=True)

        print(f'wrote constructor to {output_path}')
        with open(output_path) as f:
            print(f.read())
    - uses: gardener/cc-utils/.github/actions/upload-artifact@v1
      with:
        name: component-constructor
        path: ${{ inputs.output-path }}
