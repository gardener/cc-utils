name: merge-ocm-fragments
description: |
  Imports OCM-fragments (as exported from `export-ocm-fragments` action), and a
  base OCM component constructor, and merges them into a resulting OCM component constructor.

  The output-directory (`outdir`) will be populated like so:

  ```
  component-constructor.yaml
  blobs.d/<alg>:<hexdigest>
  ```

  `component-constructor.yaml` will contain merged contents from all imported ocm-artefact-fragments,
  as well as any contents from passed `component-constructor`, whereas `blobs.d` will contain
  combined imported blob-files (if any).

inputs:
  component-constructor:
    required: false
    type: string
    description: |
      The (base) component-constructor to merge ocm-fragments into. If it is not passed, a minimal
      one will be created.
  component-constructor-artefact:
    required: false
    type: string
    description: |
      If passed, the passed name is assumed to refer to an (existing) artefact of this name,
      containing a (base) component-constructor, as output by the `component-descriptor-to-constructor`
      action.

      I.e. it must contain (at least) a file named `component-constructor.tar.gz`, which in turn
      must (at least) contain a file `component-constructor.yaml`, which is used as base
      component-constructor.
  ctx:
    required: false
    type: string
    description: |
      an optional ctx used for filtering which ocm-fragment-artefacts to import.
      counterpart to `import-ocm-fragments`'s `ctx`-input.

  outdir:
    required: false
    type: string
    default: /tmp/ocm
    description: |
      the directory into which the merged component-constructor, as well as the imported blobs
      are to be written.

  post-process:
    type: choice
    default: component-cli
    options:
      - component-cli
      - none
      - callback
    description: |
      configures how the merged component-constructor should be post-processed.

      `component-cli` option is needed for properly honouring imagevectors (this will both
      add component-references, and referenced oci-image-resources, as well as adding
      labels for calculating image-vector-overwrites).

      `callback` is a compatibility option to mimick the behaviour of Concourse-Pipeline
      Template. Expects hardcoded path at `.ci/component_descriptor`. No additional documentation
      provided at this point, as this option is present for backwards-compatibility reasons, and
      should not be used in general.

  ocm-component-prefixes:
    type: string
    default: europe-docker.pkg.dev/gardener-project/releases/gardener,europe-docker.pkg.dev/gardener-project/snapshots/gardener
    description: |
      the ocm-component-prefixes to use in case post-processing is set to `component-cli`.

  oci-registry:
    required: false
    type: string
    description: |
      If passed, SPDX documents are generated for all external OCI resources and stored in
      a cache repository under this registry. OCI authentication is performed against the
      registry automatically (OIDC preferred; the calling job must have `id-token: write`).

      When omitted, the action behaves exactly as before — no SPDX generation, no OCI auth.

  sbom-cache-repo-prefix:
    required: false
    type: string
    default: sbom-cache
    description: |
      Repository-name prefix used when storing cached SBOM documents inside `oci-registry`.
      Defaults to `sbom-cache`.

  spdx-force-rescan:
    required: false
    type: boolean
    default: false
    description: |
      When set to `true`, the SBOM cache is ignored and all external images are re-scanned.
      Useful when a newer syft version is desired. Defaults to `false`.

  upload-artifact-name:
    required: false
    type: string
    default: merged-component-constructor
    description: |
      Name under which the merged component-descriptor is uploaded as a GHA artifact.
      Set to an empty string to skip the upload (e.g. when the descriptor is only needed
      within the same job, to avoid artifact-name collisions in matrix jobs).

outputs:
  component-constructor-artifact:
    description: |
      name of the GHA artifact containing the merged component-constructor.
      The artifact holds a single file `component-constructor.tar.gz` which
      in turn contains `component-constructor.yaml`.
      Empty if `upload-artifact-name` input is empty.
    value: ${{ inputs.upload-artifact-name }}
  component-constructor-path:
    description: |
      Path to the merged component-constructor.yaml on the runner filesystem.
    value: ${{ inputs.outdir }}/component-constructor.yaml
  name:
    description: |
      the component-name (for convenience)
    value: ${{ steps.merge.outputs.name }}
  version:
    description: |
      the component-version (for convenience)
    value: ${{ steps.merge.outputs.version }}
  component-version:
    description: |
      the {component-name}:{component-version} (for convenience)
    value: ${{ steps.merge.outputs.component-version }}

runs:
  using: composite
  steps:
    - name: install-gardener-gha-libs
      uses: gardener/cc-utils/.github/actions/install-gardener-gha-libs@8R0WNI3-ocm
    - name: preprocess
      id: preprocess
      shell: bash
      run: |
        ctx="${{ inputs.ctx }}"
        if [ -n "${ctx}" ]; then
          artefact_name="${ctx}-*.ocm-artefacts"
        else
          artefact_name="*.ocm-artefacts"
        fi
        echo "artefact-name=${artefact_name}" >> "${GITHUB_OUTPUT}"
        mkdir -p "${{ inputs.outdir }}"
    - name: import-component-constructor
      shell: bash
      if: ${{ inputs.component-constructor != '' }}
      run: |
        cat <<EOF > "${{ inputs.outdir }}/component-constructor.yaml"
        ${{ inputs.component-constructor }}
        EOF
    - name: import-component-constructor-artefact
      if: ${{ inputs.component-constructor-artefact != '' }}
      uses: gardener/cc-utils/.github/actions/download-artifact@8R0WNI3-ocm
      with:
        name: ${{ inputs.component-constructor-artefact }}
    - name: extract-component-constructor-artefact
      if: ${{ inputs.component-constructor-artefact != '' }}
      shell: bash
      run: |
        archive=component-constructor.tar.gz
        if [ ! -f "${archive}" ]; then
          echo "Error: expected file not present: ${archive}"
          exit 1
        fi
        tar xf ${archive}
        component_constructor_path='component-constructor.yaml'
        if [ ! -f "${component_constructor_path}" ]; then
          echo "Error: archive did not contain expected ${component_constructor_path} file"
          exit 1
        fi
        mv "${component_constructor_path}" "${{ inputs.outdir }}/component-constructor.yaml"
    - name: import-ocm-fragments
      uses: gardener/cc-utils/.github/actions/download-artifact@8R0WNI3-ocm
      with:
        pattern: ${{ steps.preprocess.outputs.artefact-name }}
        path: ${{ inputs.outdir }}
        merge-multiple: true
    - name: extract-ocm-fragments
      shell: bash
      run: '"${{ github.action_path }}/extract.sh" "${{ inputs.outdir }}"'
    - name: merge-fragments
      id: merge
      shell: python
      run: |
        import os
        import pprint
        import sys

        import yaml

        sys.path.insert(0, os.environ['GITHUB_ACTION_PATH'])
        import merge_ocm

        out_dir = '${{ inputs.outdir }}'
        with open(component_constructor_path := f'{out_dir}/component-constructor.yaml') as f:
          component_constructor = yaml.safe_load(f)

        merge_ocm.merge_fragments(
            component_constructor=component_constructor,
            fragments_dir=out_dir,
        )

        pprint.pprint(component_constructor)

        with open(component_constructor_path, 'w') as f:
          yaml.safe_dump(component_constructor, f)

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
          name = component_constructor['name']
          version = component_constructor['version']
          f.write(f'name={name}\n')
          f.write(f'version={version}\n')
          f.write(f'component-version={name}:{version}\n')

    - name: checkout-for-postprocessing
      uses: gardener/cc-utils/.github/actions/trusted-checkout@8R0WNI3-ocm
      if: ${{ inputs.post-process == 'component-cli' }}
      with:
        path: repo.d # avoid conflicts w/ component-descriptor
        remove-trusted-label: false
    - name: post-process
      if: ${{ inputs.post-process == 'component-cli' }}
      shell: python
      run: |
        import dataclasses
        import logging
        import os

        import yaml

        import ocm
        import ocm.gardener

        logger = logging.getLogger('post-process')

        logger.info('looking for imagevector')
        if not (imagevector_file := ocm.gardener.find_imagevector_file(repo_root='repo.d')):
          logger.info('did not find imagevector')
          exit(0)

        out_dir = '${{ inputs.outdir }}'
        with open(component_constructor_path := f'{out_dir}/component-constructor.yaml') as f:
          component_constructor = ocm.ComponentConstructor.from_dict(
            yaml.safe_load(f),
          )

        prefixes = '${{ inputs.ocm-component-prefixes }}'.split(',')
        prefixes = ocm.gardener.expand_ocm_component_prefixes(prefixes)
        logger.info(f'{prefixes=}')

        if os.path.isfile(base_component_path := 'base-component.yaml'):
          with open(base_component_path) as f:
            raw_base_component = yaml.safe_load(f)
            if raw_base_component.get('componentPrefixes'):
              logger.info(f'using component-prefixes from {base_component_path} file')
              prefixes = raw_base_component.get('componentPrefixes')

        logger.info(f'{prefixes=}')

        ocm.gardener.add_resources_from_imagevector(
          component=component_constructor,
          images=ocm.gardener.iter_images_from_imagevector(
            images_yaml_path=imagevector_file,
          ),
          component_prefixes=prefixes,
          deduplicate_resources=True,
        )
        with open(component_constructor_path, 'w') as f:
          yaml.dump(
            data=dataclasses.asdict(component_constructor),
            stream=f,
            Dumper=ocm.EnumValueYamlDumper,
          )

    - name: post-process
      if: ${{ inputs.post-process == 'callback' }}
      shell: bash
      run: |
        set -euo pipefail

        export BASE_DEFINITION_PATH="${{ inputs.outdir }}/base-component-descriptor.yaml"
        export COMPONENT_DESCRIPTOR_PATH="${{ inputs.outdir }}/component-constructor.yaml"
        cname=$(
          cat ${{ inputs.outdir }}/component-constructor.yaml \
          yq -r .name \
        )
        export COMPONENT_NAME=$cname

        callback=.ci/component_descriptor

        if [ ! -f ${callback} ]; then
          echo "Error: no such file: ${callback}"
          exit 1
        fi

        if [ ! -x ${callback} ]; then
          echo "Error: not an executable file: ${callback}"
          exit 1
        fi

        if ! ${callback}; then
          echo "Error: callback returned an error (see above)"
          exit 1
        fi

        if [ ! -f ${COMPONENT_DESCRIPTOR_PATH} ]; then
          echo "Error: callback did not create ${COMPONENT_DESCRIPTOR_PATH}"
          exit 1
        fi

    - name: install-syft
      if: ${{ inputs.oci-registry != '' }}
      uses: gardener/cc-utils/.github/actions/install-syft@8R0WNI3-ocm

    - name: install-cbomkit-theia
      if: ${{ inputs.oci-registry != '' }}
      uses: gardener/cc-utils/.github/actions/install-cbomkit-theia@8R0WNI3-ocm

    - name: authenticate-for-spdx
      if: ${{ inputs.oci-registry != '' }}
      uses: gardener/cc-utils/.github/actions/oci-auth@8R0WNI3-ocm
      with:
        oci-image-reference: ${{ inputs.oci-registry }}
        gh-token: ${{ github.token }}

    - name: spdx-external-resources
      if: ${{ inputs.oci-registry != '' }}
      shell: python
      run: |
        import logging
        import os
        import sys

        sys.path.insert(0, os.environ['GITHUB_ACTION_PATH'])
        import spdx_external

        logging.basicConfig(level=logging.INFO, stream=sys.stderr)

        spdx_external.process_external_resources(
            component_constructor_path='${{ inputs.outdir }}/component-constructor.yaml',
            out_dir='${{ inputs.outdir }}',
            cache_registry='${{ inputs.oci-registry }}',
            cache_repo_prefix='${{ inputs.sbom-cache-repo-prefix }}',
            force_rescan='${{ inputs.spdx-force-rescan }}' == 'true',
        )

    - name: upload-component-constructor-artifact
      if: ${{ inputs.upload-artifact-name != '' }}
      shell: bash
      run: |
        set -eu
        tar czf /tmp/component-constructor.tar.gz \
          -C "${{ inputs.outdir }}" component-constructor.yaml
    - uses: gardener/cc-utils/.github/actions/upload-artifact@8R0WNI3-ocm
      if: ${{ inputs.upload-artifact-name != '' }}
      with:
        name: ${{ inputs.upload-artifact-name }}
        path: /tmp/component-constructor.tar.gz
