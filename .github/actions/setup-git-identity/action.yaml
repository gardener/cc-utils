name: Setup Git Identity
description: |
  Configures the Git user identity (user.name, user.email) such to allow issuing of git-commands
  that need this cfg (most prominently creating new commits).

  Existing cfg will be preserved
inputs:
  user_name:
    description: The Git user name
    required: false
    default: github-actions[bot]
  user_email:
    description: The Git user email
    required: false
    default: ''
  github_hostname:
    description: Overwrite of the GitHub hostname to determine the appropriate default GHA user
    required: false
    default: ''
  scope:
    description: Either the path to the git config or one of the special values "local" and "global"
    required: false
    default: local
runs:
  using: composite
  steps:
    - name: Set Git user identity
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        USER_NAME: ${{ inputs.user_name }}
        USER_EMAIL: ${{ inputs.user_email }}
        GITHUB_HOSTNAME: ${{ inputs.github_hostname }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$PWD"

        # build scope as an array so a "--file <path>" value cannot be split or
        # interpreted as shell by an unquoted expansion
        case "$SCOPE" in
          global) config_scope=(--global) ;;
          local)  config_scope=(--local) ;;
          *)      config_scope=(--file "$SCOPE") ;;
        esac

        if ! git config "${config_scope[@]}" user.name >/dev/null; then
          git config "${config_scope[@]}" user.name "$USER_NAME"
        fi

        if ! git config "${config_scope[@]}" user.email >/dev/null; then
          user_email="$USER_EMAIL"

          if [[ -z "$user_email" ]]; then
            github_host="$GITHUB_HOSTNAME"

            if [[ -z "$github_host" ]]; then
              # determine user email address based on current GH-instance
              github_host="${GITHUB_SERVER_URL#https://}"
            fi

            case "$github_host" in
              github.com*)
              user_id="41898282"
              ;;
              github.tools*)
              user_id="33697"
              ;;
              github.wdf*)
              user_id="127534"
              ;;
              *)
              echo "don't know how to handle GitHub host ${github_host}"
              exit 1
              ;;
            esac

            user_email="${user_id}+github-actions[bot]@users.noreply.${github_host}"
          fi

          git config "${config_scope[@]}" user.email "$user_email"
        fi
